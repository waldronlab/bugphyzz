[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugphyzz"
version = "0.0.1"
description = "Python port of Bugphyzz physiology annotations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Waldron Lab" }
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "platformdirs>=4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "build>=1.2",
  "twine>=5"
]

taxonomy = [
  "ete3>=3.1.3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bugphyzz = ["resources/*.tsv", "resources/*.txt"]
