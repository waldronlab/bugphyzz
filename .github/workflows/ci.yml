# R CMD check and BiocCheck in the Bioconductor container, from
# https://github.com/Bioconductor/workflows (ci.yml template), with every
# option turned on: Codecov, an HTML coverage report, cyclomatic complexity
# and pkgdown. See https://github.com/waldronlab/bioc-package-template
name: Bioconductor CI

on:
  push:
    branches: [ devel, main, master, RELEASE_* ]
  pull_request:
    branches: [ devel, main, master, RELEASE_* ]

jobs:
  bioccheck:
    # Required for enable_pkgdown: true
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: bioconductor/workflows/.github/workflows/bioccheck.yml@main
    with:
      rcmdcheck_error_on: 'warning'
      enable_pkgdown: true
      enable_cyclocomp: true
      enable_coverage_report: true
    # Test coverage via Codecov, using the waldronlab organization secret.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
